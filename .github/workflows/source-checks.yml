name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q LocalFUT

      - name: Block private and proprietary files
        shell: pwsh
        run: |
          $blockedPattern = '(?i)(^|/)(certs?|diagnostics?|research|\.runtime)(/|$)|\.(exe|dll|pdb|zip|7z|rar|cas|toc|sb|cat|big|dds|db|sqlite3|pem|key|pfx|p12|crt|cer|jsonl|log)$'
          $blocked = @(git ls-files | Where-Object { $_ -match $blockedPattern })
          if ($blocked.Count) {
            Write-Error ("Private or proprietary files are tracked:`n" + ($blocked -join "`n"))
            exit 1
          }
